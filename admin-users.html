<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Klipe — Usuários</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23284A77' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='4' width='18' height='16' rx='2'/%3E%3Cpath d='M7 4v16'/%3E%3Cpath d='M17 4v16'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #020617;
      --bg-2: #0f172a;
      --bg-3: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --dim: #64748b;
      --brand: #284A77;
      --brand-2: #1e3a5f;
      --brand-hover: #3d6ba3;
      --up: #10b981;
      --down: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    body {
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 880px; }
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }
    .admin-brand { display: inline-flex; align-items: center; gap: 10px; flex: 1; }
    .admin-brand img { width: 40px; height: 40px; display: block; }
    .admin-brand-copy { display: flex; flex-direction: column; gap: 3px; }
    .admin-brand-name { font-size: 1.15rem; font-weight: 800; line-height: 1; }
    .admin-brand-meaning { color: var(--muted); font-size: 0.58rem; font-weight: 700; line-height: 1; }
    .back {
      color: var(--muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      transition: color 0.15s, border-color 0.15s;
    }
    .back:hover { color: var(--text); border-color: var(--brand); }
    .back svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 1.5rem; letter-spacing: -0.02em; flex: 1; }
    .whoami { color: var(--muted); font-size: 0.85rem; }

    .card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card h2 svg { width: 18px; height: 18px; stroke: var(--brand); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 0.82rem; color: var(--muted); }
    input, select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus { border-color: var(--brand); }
    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      justify-content: flex-end;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-3);
      color: var(--text);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: #263548; border-color: var(--brand); }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    .btn.primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }
    .btn.primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
    .btn.danger { color: var(--muted); }
    .btn.danger:hover { color: var(--down); border-color: var(--down); background: transparent; }
    .btn svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 12px 8px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    th {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }
    tr:last-child td { border-bottom: none; }
    .role-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .role-badge.admin { background: rgba(40, 74, 119, 0.3); color: var(--brand-hover); border: 1px solid var(--brand); }
    .role-badge.member { background: rgba(148, 163, 184, 0.1); color: var(--muted); border: 1px solid var(--border); }
    .msg { font-size: 0.85rem; margin-top: 8px; min-height: 1.2em; }
    .msg.ok { color: var(--up); }
    .msg.err { color: var(--down); }
    .empty { color: var(--dim); font-style: italic; text-align: center; padding: 24px; }
    .self { color: var(--muted); font-style: italic; font-size: 0.8rem; }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="/" class="back">
        <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Voltar
      </a>
      <div class="admin-brand" title="Kinetic Linking Intelligent Production Engine">
        <img src="/marca/klipe-mark.svg" alt="" width="40" height="40" />
        <span class="admin-brand-copy">
          <span class="admin-brand-name">Klipe</span>
          <span class="admin-brand-meaning">KINETIC LINKING INTELLIGENT PRODUCTION ENGINE</span>
        </span>
      </div>
      <h1>Usuários</h1>
      <div class="whoami" id="whoami">…</div>
    </header>

    <div class="card">
      <h2>
        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        Novo usuário
      </h2>
      <div class="grid">
        <label>Usuário
          <input type="text" id="new-username" autocomplete="off" placeholder="joao" />
        </label>
        <label>Senha (min 6)
          <input type="password" id="new-password" autocomplete="new-password" placeholder="•••••••" />
        </label>
        <label>Nome (opcional)
          <input type="text" id="new-name" autocomplete="off" placeholder="João Silva" />
        </label>
        <label>Papel
          <select id="new-role">
            <option value="member">member</option>
            <option value="admin">admin</option>
          </select>
        </label>
      </div>
      <div class="form-actions">
        <button class="btn primary" id="btn-create">Criar usuário</button>
      </div>
      <div class="msg" id="create-msg"></div>
    </div>

    <div class="card">
      <h2>
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Usuários cadastrados
      </h2>
      <table id="users-table">
        <thead>
          <tr>
            <th>Usuário</th>
            <th>Nome</th>
            <th>Papel</th>
            <th>Criado</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="users-body"></tbody>
      </table>
      <div class="msg" id="list-msg"></div>
    </div>
  </div>

  <script>
    // Config endpoints (o mesmo template é adaptado por app).
    const API = {
      list:   '/api/admin/users',
      create: '/api/admin/users',
      del:    (id) => `/api/admin/users/${id}`,
      me:     '/auth/me',
    };

    let ME = null;

    function el(id) { return document.getElementById(id); }

    async function loadMe() {
      const r = await fetch(API.me, { credentials: 'same-origin' });
      if (!r.ok) { location.href = '/login'; return; }
      const j = await r.json();
      ME = j.user || j;
      el('whoami').textContent = ME.username ? `logado como ${ME.username} (${ME.role})` : '';
      if (ME.role !== 'admin') {
        document.body.innerHTML = '<div style="padding:60px 24px;text-align:center;color:#ef4444">Somente admins podem acessar essa página.</div>';
      }
    }

    async function loadUsers() {
      const r = await fetch(API.list, { credentials: 'same-origin' });
      if (!r.ok) {
        el('list-msg').className = 'msg err';
        el('list-msg').textContent = 'Erro ao carregar lista (' + r.status + ')';
        return;
      }
      const j = await r.json();
      const users = j.users || [];
      const tbody = el('users-body');
      if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty">Nenhum usuário cadastrado.</td></tr>';
        return;
      }
      tbody.innerHTML = users.map(u => {
        const isSelf = ME && (u.id === ME.id || u.username === ME.username);
        const created = u.created_at || u.createdAt || '';
        const createdStr = created ? new Date(typeof created === 'number' ? created : created).toLocaleString('pt-BR') : '—';
        return `
          <tr>
            <td><b>${u.username || '—'}</b></td>
            <td>${u.name || u.display_name || u.displayName || '—'}</td>
            <td><span class="role-badge ${u.role}">${u.role || 'member'}</span></td>
            <td>${createdStr}</td>
            <td>${isSelf
              ? '<span class="self">você</span>'
              : `<button class="btn danger" onclick='deleteUser(${JSON.stringify(u.id)}, ${JSON.stringify(u.username || "")})'><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg> Excluir</button>`
            }</td>
          </tr>
        `;
      }).join('');
    }

    async function createUser() {
      const username = el('new-username').value.trim();
      const password = el('new-password').value;
      const name = el('new-name').value.trim();
      const role = el('new-role').value;
      const msg = el('create-msg');
      msg.textContent = '';
      msg.className = 'msg';
      if (!username || !password) {
        msg.className = 'msg err';
        msg.textContent = 'Usuário e senha são obrigatórios.';
        return;
      }
      const btn = el('btn-create');
      btn.disabled = true;
      btn.textContent = 'Criando…';
      try {
        const r = await fetch(API.create, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          credentials: 'same-origin',
          body: JSON.stringify({ username, password, name, role }),
        });
        const j = await r.json().catch(() => ({}));
        if (r.ok && j.ok) {
          msg.className = 'msg ok';
          msg.textContent = `Usuário "${username}" criado.`;
          el('new-username').value = '';
          el('new-password').value = '';
          el('new-name').value = '';
          el('new-role').value = 'member';
          await loadUsers();
        } else {
          msg.className = 'msg err';
          msg.textContent = 'Erro: ' + (j.error || j.detail || r.status);
        }
      } catch (e) {
        msg.className = 'msg err';
        msg.textContent = 'Erro de conexão';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Criar usuário';
      }
    }

    async function deleteUser(id, username) {
      if (!confirm(`Excluir o usuário "${username}"?`)) return;
      const r = await fetch(API.del(id), {
        method: 'DELETE',
        credentials: 'same-origin',
      });
      const msg = el('list-msg');
      if (r.ok) {
        msg.className = 'msg ok';
        msg.textContent = `Usuário "${username}" excluído.`;
        await loadUsers();
      } else {
        const j = await r.json().catch(() => ({}));
        msg.className = 'msg err';
        msg.textContent = 'Erro: ' + (j.error || j.detail || r.status);
      }
      setTimeout(() => { msg.textContent = ''; msg.className = 'msg'; }, 3000);
    }

    el('btn-create').addEventListener('click', createUser);
    // Enter na senha submit
    el('new-password').addEventListener('keydown', (e) => { if (e.key === 'Enter') createUser(); });

    (async () => { await loadMe(); await loadUsers(); })();
  </script>
</body>
</html>
