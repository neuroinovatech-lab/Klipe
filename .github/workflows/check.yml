name: Verificação

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: Sintaxe e configuração
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validar servidor Node
        run: npm run check

      - name: Testar atualizacoes Git e protecao dos projetos
        run: node --test tests/update-api.test.cjs

      - name: Testar ciclo de vida das miniaturas do preview
        run: node --test tests/video-thumbnails.test.cjs

      - name: Desktop workspace preferences
        run: node --test tests/workspace.test.cjs

      - name: Verify bundled sound library
        run: node --test tests/sfx-library.test.cjs

      - name: Validar scripts Python
        run: python -m compileall -q -x "(^|/)(node_modules|\.git)/" .

      - name: Validar JSON
        run: python -c "import json,pathlib; [json.loads(p.read_text(encoding='utf-8-sig')) for p in pathlib.Path('.').rglob('*.json')]"
