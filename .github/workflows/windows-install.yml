name: Instalacao Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/*windows*.ps1'
      - 'tools/install-desktop.ps1'
      - 'app/**'
      - '*Klipe.bat'
      - 'requirements*.txt'
      - 'package*.json'
      - 'tests/windows-installer.test.ps1'
      - '.github/workflows/windows-install.yml'
  pull_request:
    paths:
      - 'tools/*windows*.ps1'
      - 'tools/install-desktop.ps1'
      - 'app/**'
      - '*Klipe.bat'
      - 'requirements*.txt'
      - 'package*.json'
      - 'tests/windows-installer.test.ps1'
      - '.github/workflows/windows-install.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Testar instalador com Windows PowerShell
        shell: powershell
        run: ./tests/windows-installer.test.ps1
      - name: Instalar dependencias e recorte local
        shell: powershell
        run: ./tools/install-windows.ps1 -Yes
      - name: Testar editor
        run: node --test tests/*.test.cjs
      - name: Testar render e ciclo de vida Desktop
        shell: powershell
        run: |
          $runtime = Get-Content .klipe-runtime.json -Raw | ConvertFrom-Json
          $env:KLIPE_FFMPEG = $runtime.ffmpeg
          $env:KLIPE_FFPROBE = $runtime.ffprobe
          .venv/Scripts/python.exe -m unittest discover -s tests -p 'test_*.py'
      - name: Verificar executavel Desktop
        shell: powershell
        run: |
          $app = Start-Process -FilePath app/dist/Klipe.exe -ArgumentList '--smoke-test logs/desktop-ci.json --smoke-close-test' -WindowStyle Hidden -PassThru
          if (-not $app.WaitForExit(90000)) { Stop-Process -Id $app.Id; throw 'Desktop excedeu o tempo de teste' }
          if ($app.ExitCode -ne 0) { throw 'Desktop falhou' }
          $result = Get-Content logs/desktop-ci.json -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.serverStopped -or -not $result.guardedClose) { throw 'Janela, fechamento ou servidor nao passou na verificacao' }
      - name: Iniciar e verificar servidor
        shell: powershell
        run: ./tools/start-windows.ps1 -SmokeTest
      - name: Guardar logs em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instalacao-windows-logs
          path: logs/
