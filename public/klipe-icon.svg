<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#2A1B0C"/>
      <stop offset="50%" stop-color="#0F0A0F"/>
      <stop offset="100%" stop-color="#1A0F1F"/>
    </linearGradient>
    <linearGradient id="kGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#FFF4D8"/>
      <stop offset="45%" stop-color="#FFB44A"/>
      <stop offset="100%" stop-color="#E8940A"/>
    </linearGradient>
    <linearGradient id="triGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%"  stop-color="#FFB44A"/>
      <stop offset="100%" stop-color="#E8940A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#E8940A" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#E8940A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E8940A" stop-opacity="0"/>
    </radialGradient>
    <filter id="kGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fundo arredondado -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bgGrad)"/>

  <!-- Ring sutil interno -->
  <rect x="20" y="20" width="984" height="984" rx="200" ry="200"
        fill="none" stroke="rgba(232,148,10,0.18)" stroke-width="2"/>

  <!-- Glow halo central -->
  <circle cx="512" cy="512" r="360" fill="url(#glow)"/>

  <!-- K + Play triangle -->
  <g filter="url(#kGlow)">
    <!-- Barra vertical -->
    <rect x="262" y="208" width="138" height="608" rx="22" ry="22" fill="url(#kGrad)"/>
    <!-- Triangulo play (lados direitos do K) -->
    <path d="M 420,250 L 420,774 L 790,512 Z" fill="url(#triGrad)" stroke-linejoin="round"/>
  </g>

  <!-- Reflexo brilho na barra -->
  <rect x="282" y="230" width="22" height="240" rx="11" ry="11"
        fill="rgba(255,255,255,0.55)"/>

  <!-- Linha de cinema embaixo (film strip dots) -->
  <g opacity="0.55">
    <circle cx="380" cy="888" r="7" fill="#E8940A"/>
    <circle cx="430" cy="888" r="7" fill="#E8940A"/>
    <circle cx="480" cy="888" r="7" fill="#E8940A"/>
    <circle cx="540" cy="888" r="7" fill="#FFB44A"/>
    <circle cx="590" cy="888" r="7" fill="#E8940A"/>
    <circle cx="640" cy="888" r="7" fill="#E8940A"/>
  </g>
</svg>
