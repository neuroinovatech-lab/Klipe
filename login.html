<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Klipe — entrar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='4' width='18' height='16' rx='2'/%3E%3Cpath d='M7 4v16'/%3E%3Cpath d='M17 4v16'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #020617;
      --bg-2: #0f172a;
      --bg-3: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --brand: #38bdf8;
      --brand-2: #0ea5e9;
      --down: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background:
        radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.08), transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.06), transparent 50%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-mark { width: 48px; height: 48px; flex: 0 0 auto; }
    .brand-mark img { width: 100%; height: 100%; display: block; }
    .brand-copy { display: flex; flex-direction: column; gap: 5px; }
    .brand-name {
      color: var(--text);
      font-size: 1.65rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0;
    }
    .brand-meaning {
      color: var(--muted);
      font-size: 0.61rem;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0;
    }
    h2 { font-size: 1.05rem; letter-spacing: -0.01em; font-weight: 600; }
    p { color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 0.82rem; color: var(--muted); }
    input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--brand); }
    .btn {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      color: #0b1220;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.15s;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    .error {
      color: var(--down);
      font-size: 0.85rem;
      min-height: 1.2em;
      text-align: center;
    }
  </style>
</head>
<body>
  <form class="card" id="login-form">
    <div class="brand">
      <span class="brand-mark">
        <img src="/marca/klipe-mark.svg" alt="" width="48" height="48" />
      </span>
      <span class="brand-copy">
        <span class="brand-name">Klipe</span>
        <span class="brand-meaning">KINETIC LINKING INTELLIGENT<br>PRODUCTION ENGINE</span>
      </span>
    </div>
    <h2>Entrar no editor</h2>
    <p>Cada usuário tem seus próprios projetos. Fale com o admin se precisar de conta.</p>
    <label>Usuário
      <input type="text" id="username" autocomplete="username" required autofocus />
    </label>
    <label>Senha
      <input type="password" id="password" autocomplete="current-password" required />
    </label>
    <div class="error" id="err"></div>
    <button class="btn" type="submit" id="submit">Entrar</button>
  </form>

  <script>
    const form = document.getElementById('login-form');
    const err = document.getElementById('err');
    const btn = document.getElementById('submit');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Entrando…';
      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (data.ok) {
          window.location.href = '/';
        } else {
          err.textContent = data.error === 'invalid_credentials' ? 'usuário ou senha errados' : ('erro: ' + data.error);
          btn.disabled = false;
          btn.textContent = 'Entrar';
        }
      } catch {
        err.textContent = 'erro de conexão';
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
